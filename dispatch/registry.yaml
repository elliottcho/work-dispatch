manager: Kenneth
note_sources:
  manual:
    label: My notes from Kenneth
    description: 'What you wrote down from syncs, standups, hallway chats, or DMs.
      Your synthesis — not Kenneth''s raw notes.

      '
  calls:
    label: Team calls
    description: Group meetings in Granola (standups, team syncs, reviews)
    granola:
      title_patterns:
      - standup
      - sync
      - team
      - weekly
      - review
  one_on_one:
    label: 1:1 meetings
    description: 1:1s with Kenneth or stakeholders
    granola:
      title_patterns:
      - '1:1'
      - 1-on-1
      - one on one
      require_manager: true
integrations:
  enabled: true
  require_flowchart_first: true
  sources:
  - confluence
  - redshift
  - mode
  confluence:
    space_key: PANTRY
    mcp_server: atlassian
  replit:
    default_optional: true
  stages:
  - id: flowchart
    order: 0
    label: Show flowchart & explain pipeline
    type: gate
  - id: granola
    order: 1
    label: Granola meetings
    mcp_server: granola
    type: mcp
  - id: confluence
    order: 2
    label: Confluence Pantry docs
    mcp_server: atlassian
    type: mcp
  - id: redshift
    order: 3
    label: Redshift via Finch
    mcp_server: finch-redshift
    type: mcp
  - id: mode
    order: 4
    label: Mode analytics
    mcp_server: mode-analytics
    type: mcp
  - id: route
    order: 5
    label: Parse & route workstreams
    type: internal
  - id: replit
    order: 6
    label: Replit sandbox
    mcp_server: replit
    type: mcp
    optional: true
  - id: push
    order: 7
    label: Push briefings & chats
    type: internal
granola:
  enabled: true
  lookback_days: 14
  manager_query: What did Kenneth say about my priorities, goals, and action items
    for this week?
automation:
  enabled: true
  trigger: poll
  poll_interval_minutes: 15
  granola_api:
    initial_lookback_hours: 24
  filters:
    require_manager: true
    min_action_items: 0
    title_keywords: []
    participants_any: []
  on_new_note:
    cache_context: true
    include_granola: true
    push_cursor: true
    push_asana: false
    dry_run: true
workstreams:
- id: hk-vetting
  name: Hotel Housekeepers (Lisle)
  project_path: ~/Projects/hk-vetting-funnel
  keywords:
  - housekeeper
  - housekeepers
  - hk
  - lisle
  - hyatt
  - vetting
  - funnel
  - chicago
  chat:
    title: HK · Lisle
    agent_id: dc3fd24a-3ae5-41b0-8cec-093085b19f85
  granola:
    query: Hotel housekeepers Lisle vetting funnel — decisions, action items, Bryan
      sync
    participants:
    - Kenneth
    - Bryan
  integrations:
    confluence_cql: space = PANTRY AND (text ~ "lisle" OR text ~ "housekeeper" OR
      text ~ "vetting") ORDER BY lastmodified DESC
    redshift_hint: HK Lisle funnel counts — eligible, applied, interviewed, approved,
      booked, worked
    mode_reports:
    - HK funnel
    - Lisle vetting
  asana:
    project_name: null
    section: This week
- id: pro-activation
  name: Pro Activation (Aris)
  project_path: ~/Projects/pro-activation
  keywords:
  - pro activation
  - activation
  - aris
  - signup
  - first shift
  - supply activation
  chat:
    title: PRO · Aris
    agent_id: a3f1647b-e340-4ccd-9328-982472b44512
  granola:
    query: Pro activation Aris supply activation app — decisions and action items
    participants:
    - Kenneth
    - Aris
  integrations:
    confluence_cql: space = PANTRY AND (text ~ "pro activation" OR text ~ "Aris" OR
      text ~ "supply activation") ORDER BY lastmodified DESC
    redshift_hint: Pro signup to first shift activation funnel metrics
    mode_reports:
    - Pro activation
    - signup to first shift
    replit_hint: Spike or prototype for supply activation app when needed
  asana:
    project_name: null
    section: This week
- id: general
  name: General / uncategorized
  project_path: ~/Projects/work-dispatch
  keywords: []
  chat:
    title: WD · Route
    agent_id: 6dc928c0-0ef9-47ab-983c-0cca77ee2081
  asana:
    project_name: null
    section: Inbox
routing:
  fallback_workstream: general
  min_match_score: 0.15
briefing_template: '## Work priorities ({date})


  **Source:** {note_source}


  {items}


  ## Calls & 1:1 context (Granola)


  {granola_context}


  ## Documentation & data (Pantry / Redshift / Mode)


  {integration_context}


  ---

  **Your job this session:** Turn the above into a concrete plan. Reconcile your notes
  with call/1:1 context, Pantry docs, and live metrics. List blockers, next actions,
  and what to defer.

  '
