# Workstream registry — maps Kenneth's priorities to projects, chats, and Asana.
# Update agent_id after you link a Cursor chat (cloud bc-* id or local id from dispatch list-chats).

manager: Kenneth

granola:
  enabled: true
  lookback_days: 14
  manager_query: "What did Kenneth say about my priorities, goals, and action items for this week?"
  # Dispatch chat uses Granola MCP: query_granola_meetings, list_meetings, get_meetings

# Automated ingest when new Granola notes appear (poll or webhook).
# Requires GRANOLA_API_KEY for poll-granola; see docs/automation-flow.md.
automation:
  enabled: true
  trigger: poll  # poll | webhook | cursor_cron
  poll_interval_minutes: 15  # suggested cron / Cursor Automation schedule
  granola_api:
    initial_lookback_hours: 24  # first poll only; then uses data/granola-state.json
  filters:
    require_manager: true  # only notes mentioning Kenneth (title, summary, attendees)
    min_action_items: 0    # set to 1+ to skip notes without checkbox action items
    title_keywords: []     # e.g. ["day 4", "priorities"] — empty = use default day/priority patterns
    participants_any: []   # e.g. ["Bryan", "Aris"] — empty = no participant filter
  on_new_note:
    cache_context: true
    include_granola: true
    push_cursor: true
    push_asana: false
    dry_run: true          # use `dispatch ingest --execute` to push live

workstreams:
  - id: hk-vetting
    name: Hotel Housekeepers (Lisle)
    project_path: ~/Projects/hk-vetting-funnel
    keywords:
      - housekeeper
      - housekeepers
      - hk
      - lisle
      - hyatt
      - vetting
      - funnel
      - chicago
    chat:
      title: "HK Vetting — Lisle funnel"
      agent_id: null
    granola:
      query: "Hotel housekeepers Lisle vetting funnel — decisions, action items, Bryan sync"
      participants:
        - Kenneth
        - Bryan
    asana:
      project_name: null  # set to your Asana project name
      section: "This week"

  - id: pro-activation
    name: Pro Activation (Aris)
    project_path: ~/Projects/pro-activation
    keywords:
      - pro activation
      - activation
      - aris
      - signup
      - first shift
      - supply activation
    chat:
      title: "Pro Activation — Aris track"
      agent_id: null
    granola:
      query: "Pro activation Aris supply activation app — decisions and action items"
      participants:
        - Kenneth
        - Aris
    asana:
      project_name: null
      section: "This week"

  - id: general
    name: General / uncategorized
    project_path: ~/Projects/work-dispatch
    keywords: []
    chat:
      title: "General — Kenneth dispatch"
      agent_id: null
    asana:
      project_name: null
      section: "Inbox"

routing:
  # Items that match no workstream go here
  fallback_workstream: general
  # Minimum keyword score (0–1) to assign a workstream; below → fallback
  min_match_score: 0.15

briefing_template: |
  ## Kenneth's priority ({date})

  {items}

  ## Meeting context (Granola)

  {granola_context}

  ---
  **Your job this session:** Turn the above into a concrete plan for today. Reconcile Kenneth's notes with meeting decisions. List blockers, next actions, and what to defer. Do not start unrelated work.
