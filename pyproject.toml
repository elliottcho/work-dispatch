[project]
name = "work-dispatch"
version = "0.1.0"
description = "Route manager priorities into the right Cursor chats and Asana tasks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.scripts]
dispatch = "dispatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dispatch*"]
